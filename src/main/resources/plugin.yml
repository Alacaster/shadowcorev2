name: ShadowCore
version: '${version}'
main: dev.shadowcore.ShadowCorePlugin
api-version: '1.21'
load: STARTUP
author: ShadowCore
description: Identity orchestration — local profiles, shadow mounting, multi-login. 4.0 skeleton.

# ProtocolLib is a soft-dependency. The plugin functions without it: the
# SkinCloak layer (outbound PlayerInfo rewriting for PHANTOM mode cheat-
# client resistance) is only installed when ProtocolLib is present, and
# PHANTOM still works without it via REMOVE broadcasts plus the vanilla
# INVISIBILITY mob effect.
#
# Using Bukkit-style plugin.yml (not paper-plugin.yml) because Paper plugins
# do not support YAML-based command declarations, and getCommand() throws
# UnsupportedOperationException during startup under paper-plugin.yml.
softdepend: [ProtocolLib]

commands:
  lprofile:
    description: Manage local profiles.
    usage: /lprofile <create|switch|list|rename|delete|status|discard|logout|main|setlimit|admindelete> ...
    aliases: [localprofile, lp]
  shadow:
    description: Mount another identity as a shadow session.
    usage: /shadow <target|logout|discard|status> ...

permissions:
  shadowcore.use:
    description: Permission to use base local profile commands.
    default: true
  shadowcore.admin:
    description: Permission to use shadow and admin commands.
    default: op
  shadowcore.profile.bypass-limit:
    description: Permission to bypass the local profile creation limit.
    default: false
